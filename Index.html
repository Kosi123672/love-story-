<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0710" />
<title>RFF707 LoveStory — Buat sesuatu yang akan dia ingat</title>
<meta name="description" content="Buat website romantis interaktif berisi foto, cerita, pesan, dan kejutan untuk seseorang yang spesial." />

<style>
/* =========================================================
   RFF707 LoveStory — style.css
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:#0b0710;color:#fff;min-height:100vh;min-height:100dvh;
  overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #ff6fa5;outline-offset:2px}

:root{
  --pink:#ff6fa5;--pink-2:#ff9ec4;--violet:#9b7bff;
  --ink:#fff;--soft:rgba(255,255,255,.66);
  --card:rgba(255,255,255,.055);--stroke:rgba(255,255,255,.12);
  --radius:20px;--shadow:0 24px 60px -30px rgba(0,0,0,.9);
  --ease:cubic-bezier(.22,.75,.25,1);
}

.glow-bg{
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(60% 40% at 15% 0%, rgba(255,111,165,.22), transparent 70%),
    radial-gradient(55% 40% at 85% 10%, rgba(155,123,255,.18), transparent 70%),
    radial-gradient(70% 50% at 50% 100%, rgba(255,158,196,.12), transparent 70%),
    #0b0710;
}

/* ---------- KOMPONEN UI ---------- */
.btn{
  appearance:none;border:0;border-radius:999px;
  padding:13px 26px;font-size:15px;font-weight:600;letter-spacing:.01em;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .18s var(--ease), box-shadow .25s var(--ease), background .2s;
  min-height:46px;text-decoration:none;
}
.btn:active{transform:scale(.965)}
.btn-primary{
  background:linear-gradient(135deg,#ff5c96,#ff8fb8 55%,#b98cff);
  color:#fff;box-shadow:0 14px 34px -14px rgba(255,92,150,.9);
}
.btn-primary:hover{box-shadow:0 18px 42px -14px rgba(255,92,150,1)}
.btn-ghost{background:rgba(255,255,255,.06);color:#fff;border:1px solid var(--stroke)}
.btn-ghost:hover{background:rgba(255,255,255,.11)}
.btn-lg{padding:16px 34px;font-size:16.5px;min-height:54px}
.btn-sm{padding:9px 16px;font-size:13.5px;min-height:38px}
.btn[disabled]{opacity:.45;pointer-events:none}

.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;background:rgba(11,7,16,.72);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.brand{font-weight:800;font-size:15px;letter-spacing:.02em}
.brand span{color:var(--pink)}
.brand-sm{font-weight:700;font-size:14px;opacity:.85}

.field{display:block;margin-bottom:16px;text-align:left}
.field > span{
  display:block;font-size:13px;font-weight:600;
  color:var(--soft);margin-bottom:7px;letter-spacing:.01em;
}
.field input,.field textarea,.field select{
  width:100%;background:rgba(255,255,255,.05);
  border:1px solid var(--stroke);border-radius:14px;
  padding:13px 15px;font-size:16px;color:#fff;
  transition:border-color .2s, background .2s, box-shadow .2s;
  resize:vertical;
}
.field input::placeholder,.field textarea::placeholder{color:rgba(255,255,255,.32)}
.field input:focus,.field textarea:focus{
  outline:none;border-color:rgba(255,111,165,.65);
  background:rgba(255,255,255,.08);
  box-shadow:0 0 0 4px rgba(255,111,165,.12);
}
.field .hintline{font-size:12px;color:rgba(255,255,255,.4);margin-top:6px}
.field.error input,.field.error textarea{border-color:rgba(255,90,90,.8)}
.err-msg{color:#ff8b8b;font-size:12.5px;margin-top:-8px;margin-bottom:14px;display:none}
.err-msg.show{display:block}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
  background:rgba(28,18,34,.96);border:1px solid var(--stroke);
  color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;
  z-index:200;opacity:0;pointer-events:none;transition:.35s var(--ease);
  box-shadow:var(--shadow);max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- HOME ---------- */
.home{max-width:1080px;margin:0 auto;padding:0 20px 80px}
.hero{text-align:center;padding:52px 0 26px}
.pill{
  display:inline-block;font-size:12px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--pink-2);
  background:rgba(255,111,165,.1);border:1px solid rgba(255,111,165,.24);
  padding:7px 15px;border-radius:999px;margin-bottom:20px;
}
.hero h1{
  font-size:clamp(34px,9vw,60px);line-height:1.05;margin:0 0 18px;
  font-weight:800;letter-spacing:-.03em;
}
.hero h1 em{
  font-style:normal;
  background:linear-gradient(120deg,#ff5c96,#ff9ec4 45%,#b98cff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.quote{font-size:clamp(16px,4.2vw,20px);font-style:italic;color:rgba(255,255,255,.85);margin:0 0 14px;font-weight:500}
.sub{font-size:15px;line-height:1.7;color:var(--soft);max-width:520px;margin:0 auto 30px}
.hint{font-size:12.5px;color:rgba(255,255,255,.38);margin-top:16px}

.mock-wrap{position:relative;display:flex;justify-content:center;padding:34px 0 10px}
.mock-glow{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(420px,90vw);height:min(420px,90vw);border-radius:50%;
  background:radial-gradient(circle,rgba(255,111,165,.35),transparent 65%);
  filter:blur(50px);z-index:0;
}
.phone{
  position:relative;z-index:1;width:min(268px,72vw);aspect-ratio:9/17.5;
  border-radius:38px;background:linear-gradient(160deg,#2a1a2e,#140b1c);
  border:1px solid rgba(255,255,255,.14);padding:9px;
  box-shadow:0 40px 80px -34px rgba(0,0,0,1), inset 0 1px 0 rgba(255,255,255,.1);
}
.phone-screen{
  position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden;
  background:linear-gradient(165deg,#3a0f28,#5d1638 55%,#7a1e47);
  display:flex;align-items:center;justify-content:center;
}
.mock-content{position:relative;z-index:2;text-align:center;padding:20px}
.mock-icon{font-size:34px;margin-bottom:12px;animation:mockPulse 2.4s ease-in-out infinite}
.mock-line{font-size:13px;color:rgba(255,255,255,.72);margin-bottom:6px}
.mock-sub{font-size:16px;font-weight:700;margin-bottom:18px}
.mock-btn{
  display:inline-block;font-size:12.5px;font-weight:600;
  padding:10px 22px;border-radius:999px;
  background:linear-gradient(135deg,#ff5c96,#ff9ec4);
  box-shadow:0 10px 24px -10px rgba(255,92,150,.9);
}
.mock-heart{position:absolute;color:rgba(255,255,255,.35);font-size:13px;animation:mockFloat 9s linear infinite}
.mock-heart.h1{left:16%;bottom:-8%}
.mock-heart.h2{left:62%;bottom:-8%;animation-delay:-3s;font-size:10px}
.mock-heart.h3{left:40%;bottom:-8%;animation-delay:-6s;font-size:16px}
@keyframes mockFloat{
  0%{transform:translateY(0) scale(.8);opacity:0}
  15%{opacity:.9}
  100%{transform:translateY(-330px) scale(1.1);opacity:0}
}
@keyframes mockPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

.features{display:grid;gap:14px;margin-top:46px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.feat{background:var(--card);border:1px solid var(--stroke);border-radius:var(--radius);padding:20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.feat h3{margin:0 0 7px;font-size:15px;font-weight:700}
.feat p{margin:0;font-size:13.5px;line-height:1.65;color:var(--soft)}
.feat .ic{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(255,111,165,.25),rgba(155,123,255,.25));
  margin-bottom:14px;font-size:17px;
}
.foot{text-align:center;padding:50px 20px 40px;color:rgba(255,255,255,.3);font-size:12.5px}

/* ---------- WIZARD ---------- */
.wizard{max-width:620px;margin:0 auto;padding:22px 18px 130px}
.progress{display:flex;align-items:flex-start;justify-content:space-between;gap:2px;margin-bottom:22px}
.prog-item{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:0}
.prog-dot{
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-size:11.5px;font-weight:700;background:rgba(255,255,255,.06);
  border:1px solid var(--stroke);color:rgba(255,255,255,.45);
  transition:.3s var(--ease);
}
.prog-item.active .prog-dot{
  background:linear-gradient(135deg,#ff5c96,#b98cff);
  border-color:transparent;color:#fff;box-shadow:0 0 0 4px rgba(255,92,150,.16);
}
.prog-item.done .prog-dot{background:rgba(255,111,165,.2);border-color:rgba(255,111,165,.5);color:#ffb8d3}
.prog-label{
  font-size:10px;letter-spacing:.03em;text-transform:uppercase;
  color:rgba(255,255,255,.35);font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
}
.prog-item.active .prog-label{color:#ffb8d3}

.card{
  background:var(--card);border:1px solid var(--stroke);border-radius:var(--radius);
  padding:26px 22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:var(--shadow);animation:cardIn .45s var(--ease);
}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.step-title{font-size:22px;margin:0 0 6px;font-weight:800;letter-spacing:-.01em}
.step-desc{font-size:14px;color:var(--soft);margin:0 0 24px;line-height:1.6}

.dropzone{
  border:1.5px dashed rgba(255,255,255,.22);border-radius:18px;
  padding:34px 20px;text-align:center;transition:.25s var(--ease);
  background:rgba(255,255,255,.02);cursor:pointer;
}
.dropzone:hover,.dropzone.drag{border-color:rgba(255,111,165,.7);background:rgba(255,111,165,.07)}
.dropzone .dz-ic{font-size:28px;margin-bottom:10px;opacity:.85}
.dropzone .dz-title{font-size:14.5px;font-weight:600;margin-bottom:5px}
.dropzone .dz-sub{font-size:12.5px;color:rgba(255,255,255,.42)}

.photo-grid{display:grid;gap:10px;margin-top:18px;grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.photo-item{
  position:relative;border-radius:14px;overflow:hidden;
  border:1px solid var(--stroke);background:rgba(255,255,255,.04);
  animation:cardIn .3s var(--ease);
}
.photo-item img{width:100%;aspect-ratio:1/1;object-fit:cover}
.photo-del{
  position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:0;
  background:rgba(10,5,15,.78);color:#fff;font-size:15px;line-height:1;
  display:grid;place-items:center;backdrop-filter:blur(6px);
}
.photo-del:active{transform:scale(.9)}
.photo-cap{
  width:100%;border:0;border-top:1px solid var(--stroke);
  background:rgba(0,0,0,.25);color:#fff;padding:8px 9px;font-size:12px;border-radius:0;
}
.photo-cap:focus{outline:none;background:rgba(0,0,0,.4)}

.tpl-grid{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tpl{
  border:1.5px solid var(--stroke);border-radius:16px;padding:14px;text-align:left;
  background:rgba(255,255,255,.03);transition:.22s var(--ease);position:relative;
}
.tpl:hover{background:rgba(255,255,255,.07)}
.tpl.sel{border-color:rgba(255,111,165,.9);background:rgba(255,111,165,.1)}
.tpl.sel::after{
  content:'✓';position:absolute;top:10px;right:11px;
  width:19px;height:19px;border-radius:50%;
  background:linear-gradient(135deg,#ff5c96,#b98cff);
  font-size:11px;display:grid;place-items:center;font-weight:700;
}
.tpl .swatch{height:34px;border-radius:10px;margin-bottom:10px}
.tpl .tname{font-size:14px;font-weight:700;margin-bottom:3px}
.tpl .tdesc{font-size:11.5px;color:var(--soft);line-height:1.45}

.sw-romantic{background:linear-gradient(135deg,#4a1230,#7a1e47,#ff9ec4)}
.sw-cute{background:linear-gradient(135deg,#ffe9f3,#e8f7ff,#fff5e1)}
.sw-dark{background:linear-gradient(135deg,#0a0718,#1b1440,#9b7bff)}
.sw-letter{background:linear-gradient(135deg,#f6ecd9,#e6d3b3,#b4622f)}
.sw-birthday{background:linear-gradient(135deg,#2b1055,#7b2ff7,#f107a3)}
.sw-emotional{background:linear-gradient(135deg,#0c0d10,#16181f,#c9a27a)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1px solid var(--stroke);background:rgba(255,255,255,.04);
  border-radius:999px;padding:9px 15px;font-size:13px;font-weight:500;
  transition:.2s var(--ease);color:rgba(255,255,255,.78);
}
.chip.sel{
  background:linear-gradient(135deg,rgba(255,92,150,.25),rgba(185,140,255,.25));
  border-color:rgba(255,111,165,.7);color:#fff;font-weight:600;
}
.chip:active{transform:scale(.95)}

.switch-row{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:14px 0;border-top:1px solid rgba(255,255,255,.07);
}
.switch-row:first-of-type{border-top:0}
.switch-row .sw-label{font-size:14px;font-weight:600}
.switch-row .sw-sub{font-size:12px;color:rgba(255,255,255,.42);margin-top:2px}
.switch{
  position:relative;width:48px;height:28px;border-radius:999px;
  background:rgba(255,255,255,.12);border:1px solid var(--stroke);
  transition:.25s var(--ease);flex-shrink:0;
}
.switch::after{
  content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;
  border-radius:50%;background:#fff;transition:.25s var(--ease);
}
.switch.on{background:linear-gradient(135deg,#ff5c96,#b98cff);border-color:transparent}
.switch.on::after{transform:translateX(20px)}

.summary{border:1px solid var(--stroke);border-radius:16px;padding:16px;background:rgba(255,255,255,.03);margin-bottom:18px}
.sum-row{display:flex;justify-content:space-between;gap:14px;padding:8px 0;font-size:13.5px;border-bottom:1px solid rgba(255,255,255,.05)}
.sum-row:last-child{border-bottom:0}
.sum-row span:first-child{color:rgba(255,255,255,.45);flex-shrink:0}
.sum-row span:last-child{text-align:right;font-weight:600;word-break:break-word}

.wizard-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:10px;
  padding:14px 18px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(11,7,16,.98) 55%,rgba(11,7,16,0));
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.wizard-nav .btn{flex:1}

/* ---------- PREVIEW & SHARE ---------- */
.preview-bar{
  position:fixed;top:0;left:0;right:0;z-index:80;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 14px;padding-top:calc(11px + env(safe-area-inset-top));
  background:rgba(10,6,14,.82);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.08);
}
.pv-label{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.45);font-weight:700}

.share-wrap{max-width:560px;margin:0 auto;padding:34px 20px 70px}
.share-hero{text-align:center;margin-bottom:26px}
.share-hero .big{font-size:44px;margin-bottom:12px;animation:mockPulse 2.6s ease-in-out infinite}
.share-hero h1{font-size:clamp(22px,6.4vw,30px);margin:0 0 10px;font-weight:800;letter-spacing:-.02em}
.share-hero p{color:var(--soft);font-size:14px;line-height:1.65;margin:0}

.link-box{
  display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);
  border:1px solid var(--stroke);border-radius:15px;padding:14px 16px;margin-bottom:16px;
}
.link-box .url{flex:1;font-size:13px;color:#ffc2d9;word-break:break-all;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.4}
.share-actions{display:grid;gap:10px}
.share-actions .btn{width:100%}

.notice{
  margin-top:22px;padding:14px 16px;border-radius:14px;
  background:rgba(255,190,80,.07);border:1px solid rgba(255,190,80,.22);
  font-size:12.5px;line-height:1.65;color:rgba(255,225,180,.85);
}
.notice b{color:#ffd98a}
.notice code{background:rgba(0,0,0,.25);padding:1px 5px;border-radius:4px;font-size:11.5px}

/* ---------- LOVESTORY VIEWER ---------- */
body.page-story{overflow:hidden;background:#05030a}
body.page-story #app{position:fixed;inset:0}

.ls{position:absolute;inset:0;overflow:hidden;background:var(--ls-bg);color:var(--ls-ink);transition:background .6s ease}
.ls::before{
  content:'';position:absolute;inset:-15%;
  background:radial-gradient(50% 40% at 25% 20%, var(--ls-glow1), transparent 70%),
             radial-gradient(45% 40% at 78% 75%, var(--ls-glow2), transparent 70%);
  animation:bgDrift 22s ease-in-out infinite alternate;pointer-events:none;
}
@keyframes bgDrift{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(3%,2%,0) scale(1.08)}}
.ls[data-anim="off"]::before{animation:none}

.ls[data-theme="romantic"]{
  --ls-bg:linear-gradient(165deg,#2a0d1e 0%,#4a1230 45%,#6d1b3f 100%);
  --ls-glow1:rgba(255,111,165,.28);--ls-glow2:rgba(255,190,220,.16);
  --ls-ink:#fff0f6;--ls-soft:rgba(255,240,246,.7);
  --ls-accent:#ff6fa5;--ls-accent2:#ffc2d9;
  --ls-card:rgba(255,255,255,.08);--ls-stroke:rgba(255,255,255,.18);
  --ls-btn-ink:#3a0f22;
}
.ls[data-theme="cute"]{
  --ls-bg:linear-gradient(165deg,#ffe9f3 0%,#eaf7ff 52%,#fff6e6 100%);
  --ls-glow1:rgba(255,168,205,.5);--ls-glow2:rgba(160,220,255,.45);
  --ls-ink:#5a3b52;--ls-soft:rgba(90,59,82,.68);
  --ls-accent:#ff8fb8;--ls-accent2:#9ad7ff;
  --ls-card:rgba(255,255,255,.66);--ls-stroke:rgba(255,255,255,.9);
  --ls-btn-ink:#fff;
}
.ls[data-theme="dark"]{
  --ls-bg:radial-gradient(125% 92% at 50% 0%,#1b1440 0%,#0a0718 58%,#040209 100%);
  --ls-glow1:rgba(155,123,255,.3);--ls-glow2:rgba(255,123,213,.2);
  --ls-ink:#eae6ff;--ls-soft:rgba(234,230,255,.62);
  --ls-accent:#9b7bff;--ls-accent2:#ff7bd5;
  --ls-card:rgba(255,255,255,.06);--ls-stroke:rgba(255,255,255,.15);
  --ls-btn-ink:#fff;
}
.ls[data-theme="letter"]{
  --ls-bg:linear-gradient(165deg,#f8f0df 0%,#efe0c6 58%,#e5d1b0 100%);
  --ls-glow1:rgba(214,160,100,.34);--ls-glow2:rgba(255,240,215,.6);
  --ls-ink:#4a3a2a;--ls-soft:rgba(74,58,42,.7);
  --ls-accent:#b4622f;--ls-accent2:#d99a5b;
  --ls-card:rgba(255,255,255,.72);--ls-stroke:rgba(120,90,60,.2);
  --ls-btn-ink:#fff5e8;
}
.ls[data-theme="birthday"]{
  --ls-bg:linear-gradient(165deg,#2b1055 0%,#7b2ff7 48%,#f107a3 100%);
  --ls-glow1:rgba(255,209,102,.3);--ls-glow2:rgba(140,233,154,.22);
  --ls-ink:#fff;--ls-soft:rgba(255,255,255,.78);
  --ls-accent:#ffd166;--ls-accent2:#ff7bd5;
  --ls-card:rgba(255,255,255,.1);--ls-stroke:rgba(255,255,255,.22);
  --ls-btn-ink:#3b1030;
}
.ls[data-theme="emotional"]{
  --ls-bg:linear-gradient(180deg,#0b0c10 0%,#15171f 55%,#0b0c10 100%);
  --ls-glow1:rgba(201,162,122,.16);--ls-glow2:rgba(120,140,180,.12);
  --ls-ink:#e9eaee;--ls-soft:rgba(233,234,238,.6);
  --ls-accent:#c9a27a;--ls-accent2:#e6cba6;
  --ls-card:rgba(255,255,255,.045);--ls-stroke:rgba(255,255,255,.11);
  --ls-btn-ink:#16120c;
}
.ls[data-theme="letter"] .letter-paper,
.ls[data-theme="letter"] .ls-h1,

<body class="page-home">
<div id="app"></div>

<script>
/* =========================================================
   RFF707 LoveStory — script.js (v2, IndexedDB)
   ========================================================= */

/* ============ 1. UTILS ============ */
const App = document.getElementById('app');
const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function h(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
const uid = () => Math.random().toString(36).slice(2, 9);
function makeStoryId() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out = '';
  for (let i = 0; i < 5; i++) out += chars[Math.floor(Math.random() * chars.length)];
  return out;
}
let toastTimer = null;
function toast(msg) {
  let el = $('.toast');
  if (!el) { el = h('<div class="toast"></div>'); document.body.appendChild(el); }
  el.textContent = msg;
  requestAnimationFrame(() => el.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}
function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return '';
  return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
}

/* ============ 2. STORE (IndexedDB) ============ */

const DB_NAME = 'rff707-lovestory';
const DB_VERSION = 1;
const STORE_STORIES = 'stories';
const STORE_DRAFT = 'draft';
const DRAFT_KEY = 'current';

let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) {
      reject(new Error('IndexedDB tidak didukung browser ini.'));
      return;
    }
    const req = indexedDB.open(DB_NAME, DB_VERSION);

    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_STORIES)) {
        db.createObjectStore(STORE_STORIES, { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains(STORE_DRAFT)) {
        db.createObjectStore(STORE_DRAFT);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

/* Operasi umum IndexedDB */
function idbPut(storeName, value, key) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    const store = tx.objectStore(storeName);
    const req = key !== undefined ? store.put(value, key) : store.put(value);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}
function idbGet(storeName, key) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}

/* --- Draft --- */
async function loadDraft() {
  try {
    const saved = await idbGet(STORE_DRAFT, DRAFT_KEY);
    if (saved) return Object.assign(defaultData(), saved);
  } catch (e) {
    console.warn('loadDraft gagal, mulai dari kosong:', e);
  }
  return defaultData();
}
async function saveDraft() {
  try {
    await idbPut(STORE_DRAFT, data, DRAFT_KEY);
  } catch (e) {
    console.warn('saveDraft gagal:', e);
  }
}
async function clearDraft() {
  try {
    await idbPut(STORE_DRAFT, null, DRAFT_KEY);
  } catch (e) {}
}

/* --- Cerita final --- */
async function saveStory(id, payload) {
  try {
    await idbPut(STORE_STORIES, Object.assign({ id }, payload));
    return true;
  } catch (e) {
    console.error('saveStory gagal:', e);
    return false;
  }
}
async function loadStory(id) {
  try {
    return await idbGet(STORE_STORIES, id);
  } catch (e) {
    console.error('loadStory gagal:', e);
    return null;
  }
}

/* Struktur data utama LoveStory */
function defaultData() {
  return {
    senderName: '',
    receiverName: '',
    title: '',
    openingMessage: '',
    story: '',
    mainMessage: '',
    endingMessage: '',
    photos: [],              // [{ id, src (dataURL), caption }]
    template: 'romantic',
    animations: true,
    animSet: ['hearts', 'typing', 'fadein'],
    music: false,
    date: '',
    createdAt: null
  };
}

let data = defaultData();

/* ============ 3. ROUTER ============ */
let storyCleanup = null;

function cleanupStory() {
  if (typeof storyCleanup === 'function') storyCleanup();
  storyCleanup = null;
  Music.stop();
}

async function route() {
  cleanupStory();
  const bar = $('.preview-bar');
  if (bar) bar.remove();

  const hash = (location.hash || '#/').replace(/^#/, '');
  const parts = hash.split('/').filter(Boolean);

  window.scrollTo(0, 0);

  try {
    if (parts[0] === 'l' && parts[1]) return await renderStoryPage(parts[1]);
    if (parts[0] === 'share' && parts[1]) return renderSharePage(parts[1]);
    if (parts[0] === 'preview') return renderPreviewPage();
    if (parts[0] === 'create') return renderWizard();
    return renderHome();
  } catch (e) {
    console.error('route error:', e);
    renderHome();
  }
}

window.addEventListener('hashchange', route);

/* ============ 4. HOME ============ */
function renderHome() {
  document.body.className = 'page-home';

  App.innerHTML = `
    <div class="glow-bg"></div>
    <header class="topbar">
      <div class="brand">RFF707 <span>LoveStory</span></div>
      <button class="btn btn-ghost btn-sm" id="topStart">Buat</button>
    </header>

    <main class="home">
      <section class="hero">

        <p class="sub">
          Buat website kecil yang berisi foto, cerita, pesan, dan kejutan

        </p>
        <button class="btn btn-primary btn-lg" id="startBtn">Create LoveStory ❤️</button>
        <p class="hint">Gratis · Tanpa daftar · Selesai dalam 3 menit</p>
      </section>

      <section class="mock-wrap" aria-hidden="true">
        <div class="mock-glow"></div>
        <div class="phone">
          <div class="phone-screen">
            <span class="mock-heart h1">❤</span>
            <span class="mock-heart h2">❤</span>
            <span class="mock-heart h3">❤</span>
            <div class="mock-content">
              <div class="mock-icon">💌</div>
              <div class="mock-line">Ada sesuatu untukmu...</div>
              <div class="mock-sub">Untuk Melati</div>
              <div class="mock-btn">Buka ❤️</div>
            </div>
          </div>
        </div>
      </section>

      <section class="features">
        <div class="feat"><div class="ic">📷</div><h3>Galeri Kenangan</h3>
          <p>Unggah hingga 10 foto. Otomatis dikompres agar cepat dibuka di HP.</p></div>
        <div class="feat"><div class="ic">✍️</div><h3>Pesan yang Diketik</h3>
          <p>Pesanku muncul seperti sedang ditulis, perlahan, satu per satu.</p></div>
        <div class="feat"><div class="ic">💌</div><h3>Surat Cinta</h3>
          <p>Amplop yang terbuka saat disentuh, berisi pesan panjangmu.</p></div>
        <div class="feat"><div class="ic">🎉</div><h3>Kejutan Kecil</h3>

    <div class="foot">Dibuat dengan ❤️ · RFF707 LoveStory</div>
  `;

  $('#startBtn').addEventListener('click', goCreate);

}
function goCreate() { location.hash = '#/create'; }

/* ============ 5. WIZARD ============ */
const STEPS = ['Info', 'Foto', 'Cerita', 'Tema', 'Preview', 'Generate'];
let step = 0;

function renderWizard() {
  document.body.className = 'page-app';

  App.innerHTML = `
    <div class="glow-bg"></div>
    <header class="topbar">
      <button class="btn btn-ghost btn-sm" id="backHome" aria-label="Kembali">←</button>
      <div class="brand-sm">RFF707 LoveStory</div>
      <div style="width:38px"></div>
    </header>
    <div class="wizard">
      <div id="progress"></div>
      <div class="card" id="stepCard"></div>
      <div class="wizard-nav" id="wizardNav"></div>
    </div>
  `;

  $('#backHome').addEventListener('click', () => { location.hash = '#/'; });
  renderStep();
}

function renderProgress() {
  const html = STEPS.map((label, i) => {
    const state = i < step ? 'done' : (i === step ? 'active' : '');
    const dot = i < step ? '✓' : (i + 1);
    return `<div class="prog-item ${state}">
      <span class="prog-dot">${dot}</span>
      <span class="prog-label">${label}</span>
    </div>`;
  }).join('');
  $('#progress').innerHTML = `<div class="progress">${html}</div>`;
}

function renderStep() {
  const card = $('#stepCard');
  if (step === 0) card.innerHTML = stepInfoHTML();
  else if (step === 1) card.innerHTML = stepPhotoHTML();
  else if (step === 2) card.innerHTML = stepStoryHTML();
  else if (step === 3) card.innerHTML = stepThemeHTML();

function bindStep() {
  if (step === 0) {
    bindInput('#f-sender',  v => data.senderName = v);
    bindInput('#f-receiver',v => data.receiverName = v);
    bindInput('#f-title',   v => data.title = v);
    bindInput('#f-opening', v => data.openingMessage = v);
    bindInput('#f-date',    v => data.date = v);
  }

  if (step === 1) {
    const dz = $('#dropzone');
    const fi = $('#fileInput');

    dz.addEventListener('click', () => fi.click());
    fi.addEventListener('change', e => { handleFiles(e.target.files); fi.value = ''; });

    ['dragenter', 'dragover'].forEach(ev =>
      dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('drag'); }));
    ['dragleave', 'drop'].forEach(ev =>
      dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('drag'); }));
    dz.addEventListener('drop', e => handleFiles(e.dataTransfer.files));

    $$('[data-del]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.del;
        data.photos = data.photos.filter(p => p.id !== id);
        await saveDraft();
        renderStep();
      });
    });

    $$('[data-cap]').forEach(inp => {
      inp.addEventListener('input', () => {
        const p = data.photos.find(x => x.id === inp.dataset.cap);
        if (p) { p.caption = inp.value; saveDraft(); }
      });
    });
  }

  if (step === 2) {
    bindInput('#f-story',  v => data.story = v);
    bindInput('#f-main',   v => data.mainMessage = v);
    bindInput('#f-ending', v => data.endingMessage = v);
  }

  if (step === 3) {
    $$('[data-tpl]').forEach(btn => {
      btn.addEventListener('click', () => {
        data.template = btn.dataset.tpl;
        saveDraft();
        $$('[data-tpl]').forEach(b => b.classList.toggle('sel', b === btn));
      });
    });

    $$('[data-anim]').forEach(chip => {
      chip.addEventListener('click', () => {
        const id = chip.dataset.anim;
        const i = data.animSet.indexOf(id);
        if (i >= 0) data.animSet.splice(i, 1);
        else data.animSet.push(id);
        chip.classList.toggle('sel');
        saveDraft();
      });
    });

    toggleSwitch($('#swAnim'), () => data.animations, v => { data.animations = v; saveDraft(); });
    toggleSwitch($('#swMusic'), () => data.music, v => { data.music = v; saveDraft(); });
  }

  if (step === 4) {
    $('#btnPreview').addEventListener('click', () => { location.hash = '#/preview'; });
  }
}

function bindInput(sel, setter) {
  const el = $(sel);
  if (!el) return;
  el.addEventListener('input', () => { setter(el.value); saveDraft(); });
}

function toggleSwitch(el, getter, setter) {
  const flip = () => {
    const next = !getter();
    setter(next);
    el.classList.toggle('on', next);
    el.setAttribute('aria-checked', String(next));
  };
  el.addEventListener('click', flip);
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); }
  });
}

  if (step === 0) {

/* --- Upload & kompresi foto --- */
async function handleFiles(fileList) {
  const files = Array.from(fileList || []).filter(f => f.type.startsWith('image/'));
  if (!files.length) return;

  const room = 10 - data.photos.length;
  if (room <= 0) { toast('Maksimal 10 foto ya 🙂'); return; }

  const take = files.slice(0, room);
  if (files.length > room) toast(`Hanya ${room} foto pertama yang ditambahkan.`);

  toast('Memproses foto…');

  for (const file of take) {
    try {
      const src = await compressImage(file);
      data.photos.push({ id: uid(), src, caption: '' });
    } catch (e) {
      console.warn('Gagal memproses foto:', e);
      toast('Ada foto yang gagal diproses.');
    }
  }

  await saveDraft();
  renderStep();
  toast('Foto siap ✨');
}

/**
 * Kompres & resize gambar memakai canvas.
 * maxSize = sisi terpanjang (px), quality = 0..1
 * maxSize 900 + quality 0.7 = keseimbangan bagus antara kualitas & ukuran.
 */
function compressImage(file, maxSize = 900, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let { width: w, height: h } = img;
        const scale = Math.min(1, maxSize / Math.max(w, h));
        w = Math.round(w * scale);
        h = Math.round(h * scale);

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);

        try {
          resolve(canvas.toDataURL('image/jpeg', quality));
        } catch (err) {
          reject(err);
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ============ 8. INIT STORY ============ */
function initStory(root, d, opts = {}) {
  if (!root) return () => {};

  const scenes = $$('.ls-scene', root);
  let current = 0;
  let typingDone = false;

  if (d.animations) {
    const container = $('.ls-particles', root);
    const set = d.animSet || [];
    const kinds = [];
    if (set.includes('hearts'))   kinds.push('heart');
    if (set.includes('petals'))   kinds.push('petal');
    if (set.includes('sparkles')) kinds.push('sparkle');
    if (set.includes('stars'))    kinds.push('star');
    if (!kinds.length) kinds.push(defaultKindFor(d.template));
    spawnParticles(container, kinds);
  }

  function go(n) {
    if (n < 0 || n >= scenes.length) return;
    scenes[current].classList.remove('is-active');
    current = n;
    const scene = scenes[current];
    scene.classList.add('is-active');
    scene.scrollTop = 0;
    onEnter(scene);
  }

  function onEnter(scene) {
    const name = scene.dataset.scene;

    if (name === 'typing' && !typingDone) {
      typingDone = true;
      const target = $('[data-type]', scene);
      const btn = $('[data-next]', scene);
      const text = target.dataset.type || '';
      if (!d.animations) {
        target.textContent = text;
        if (btn) btn.hidden = false;
      } else {
        typeText(target, text).then(() => { if (btn) btn.hidden = false; });
      }
    }

    if (name === 'memories') {
      const items = $$('.g-item', scene);
      requestAnimationFrame(() => {
        items.forEach((it, i) => setTimeout(() => it.classList.add('show'), i * 110));
      });
    }
  }

  root.addEventListener('click', e => {
    const nextBtn = e.target.closest('[data-next]');
    if (nextBtn) { go(current + 1); return; }
  });

  const envelope = $('[data-open-letter]', root);
  if (envelope) {
    envelope.addEventListener('click', () => {
      envelope.classList.add('open');
      setTimeout(() => {
        envelope.classList.add('gone');
        const label = $('[data-env-label]', root);
        if (label) label.hidden = true;
        const paper = $('[data-paper]', root);
        if (paper) paper.hidden = false;
        const nextBtn = $('.ls-scene[data-scene="letter"] [data-next]', root);
        if (nextBtn) nextBtn.hidden = false;
      }, 650);
    });
  }

  const yesBtn = $('[data-yes]', root);
  const noBtn = $('[data-no]', root);
  const reply = $('.ls-scene[data-scene="question"] [data-reply]', root);
  const qNext = $('.ls-scene[data-scene="question"] [data-next]', root);
  let dodgeCount = 0;

  const funnyReplies = [
    'Yakin? Coba pikir lagi 😏',
    'Hmm, sepertinya kamu bohong 🙃',
    'Eh, jangan gitu dong 🥺',
    'Yaudah, aku tahu kok kamu kangen 😌'
  ];

  if (yesBtn) {
    yesBtn.addEventListener('click', () => {
      const rect = yesBtn.getBoundingClientRect();
      heartBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);
      if (d.animations && (d.animSet || []).includes('confetti')) confettiBurst();
      if (reply) reply.textContent = 'Aku juga kangen kamu ❤️';
      if (noBtn) noBtn.style.display = 'none';
      if (yesBtn) yesBtn.style.display = 'none';
      if (qNext) qNext.hidden = false;
    });
  }

  function dodge() {
    dodgeCount++;
    if (dodgeCount >= 4) {
      if (reply) reply.textContent = funnyReplies[3];
      if (noBtn) noBtn.style.display = 'none';
      if (qNext) qNext.hidden = false;
      return;
    }
    if (reply) reply.textContent = funnyReplies[dodgeCount - 1];
    const dx = (Math.random() - 0.5) * 70;
    const dy = (Math.random() - 0.5) * 34;
    noBtn.style.transform = `translate(${dx}px, ${dy}px)`;
  }

  if (noBtn) {
    noBtn.addEventListener('click', dodge);
    noBtn.addEventListener('pointerenter', e => {
      if (e.pointerType === 'mouse' && dodgeCount < 3) dodge();
    });
  }

  const surpriseBtn = $('[data-surprise]', root);
  if (surpriseBtn) {
    surpriseBtn.addEventListener('click', () => {
      const flash = $('.flash', root);
      if (flash && d.animations) {
        flash.classList.add('go');
        setTimeout(() => flash.classList.remove('go'), 650);
      }
      surpriseBtn.hidden = true;
      const secret = $('[data-secret]', root);
      if (secret) secret.hidden = false;
      if (d.animations && (d.animSet || []).includes('confetti')) confettiBurst();
    });
  }

  const replayBtn = $('[data-replay]', root);
  if (replayBtn) {
    replayBtn.addEventListener('click', () => {
      typingDone = false;
      dodgeCount = 0;

      const typeEl = $('[data-type]', root);
      if (typeEl) typeEl.textContent = '';
      const tBtn = $('.ls-scene[data-scene="typing"] [data-next]', root);
      if (tBtn) tBtn.hidden = true;

      const env = $('[data-open-letter]', root);
      if (env) env.classList.remove('open', 'gone');
      const paper = $('[data-paper]', root);
      if (paper) paper.hidden = true;
      const envLabel = $('[data-env-label]', root);
      if (envLabel) envLabel.hidden = false;
      const lNext = $('.ls-scene[data-scene="letter"] [data-next]', root);
      if (lNext) lNext.hidden = true;

      if (reply) reply.textContent = '';
      if (yesBtn) yesBtn.style.display = '';
      if (noBtn) { noBtn.style.display = ''; noBtn.style.transform = ''; }
      if (qNext) qNext.hidden = true;

      if (surpriseBtn) surpriseBtn.hidden = false;
      const secret = $('[data-secret]', root);
      if (secret) secret.hidden = true;

      // Reset galeri
      $$('.g-item', root).forEach(it => it.classList.remove('show'));

      go(0);
    });
  }

  const musicBtn = $('[data-music]', root);
  if (musicBtn) {
    musicBtn.addEventListener('click', () => {
      const playing = Music.toggle();
      musicBtn.classList.toggle('playing', playing);
    });
  }

  onEnter(scenes[0]);

  return () => { Music.stop(); };
}

function defaultKindFor(template) {
  if (template === 'cute') return 'petal';
  if (template === 'dark') return 'star';
  if (template === 'emotional') return 'sparkle';
  return 'heart';
}

function spawnParticles(container, kinds) {
  if (!container) return;
  const count = window.innerWidth < 600 ? 12 : 20;
  const frag = document.createDocumentFragment();

  for (let i = 0; i < count; i++) {
    const kind = kinds[i % kinds.length];
    const el = document.createElement('i');
    el.className = 'p';

    if (kind === 'heart') {
      el.classList.add('p-heart', 'p-float');
      el.textContent = '❤';
      el.style.fontSize = (9 + Math.random() * 13) + 'px';
    } else if (kind === 'petal') {
      el.classList.add('p-petal', 'p-float');
      el.style.width = el.style.height = (6 + Math.random() * 7) + 'px';
    } else {
      el.classList.add('p-twinkle');
      el.style.top = (Math.random() * 100) + '%';
      el.style.animationDuration = (2 + Math.random() * 3) + 's';
      el.style.animationDelay = (Math.random() * 3) + 's';
    }

    el.style.left = (Math.random() * 100) + '%';
    if (el.classList.contains('p-float')) {
      el.style.animationDuration = (11 + Math.random() * 10) + 's';
      el.style.animationDelay = (-Math.random() * 16) + 's';
      el.style.setProperty('--dx', ((Math.random() - 0.5) * 90) + 'px');
      el.style.opacity = 0.35 + Math.random() * 0.45;
    }

    frag.appendChild(el);
  }
  container.appendChild(frag);
}

function typeText(el, text, speed = 38) {
  return new Promise(resolve => {
    let i = 0;
    el.textContent = '';
    const caret = document.createElement('span');
    caret.className = 'caret';
    el.appendChild(caret);

    function tick() {
      if (i >= text.length) {
        caret.remove();
        resolve();
        return;
      }
      caret.insertAdjacentText('beforebegin', text[i]);
      i++;
      const pause = text[i - 1] === '.' || text[i - 1] === ',' ? 150 : speed;
      setTimeout(tick, pause + Math.random() * 28);
    }
    tick();
  });
}

function heartBurst(x, y) {
  for (let i = 0; i < 14; i++) {
    const el = document.createElement('span');
    el.className = 'burst-heart';
    el.textContent = '❤';
    const ang = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 150;
    el.style.setProperty('--tx', Math.cos(ang) * dist + 'px');
    el.style.setProperty('--ty', Math.sin(ang) * dist + 'px');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.fontSize = (12 + Math.random() * 16) + 'px';
    el.style.color = ['#ff5c96', '#ff9ec4', '#ffd166', '#b98cff'][i % 4];
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }
}

function confettiBurst() {
  const canvas = document.createElement('canvas');
  canvas.className = 'confetti-canvas';
  document.body.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = window.innerWidth;
  const H = window.innerHeight;

  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);

  const colors = ['#ff6fa5', '#ffd166', '#8ce99a', '#74c0fc', '#b197fc', '#ffa8a8'];
  const parts = [];

  for (let i = 0; i < 90; i++) {
    parts.push({
      x: W / 2 + (Math.random() - 0.5) * 140,
      y: H * 0.45 + (Math.random() - 0.5) * 70,
      vx: (Math.random() - 0.5) * 9,
      vy: -Math.random() * 11 - 3,
      size: 5 + Math.random() * 7,
      color: colors[(Math.random() * colors.length) | 0],
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.32
    });
  }

  const start = performance.now();

  function frame(t) {
    const elapsed = t - start;
    ctx.clearRect(0, 0, W, H);

    parts.forEach(p => {
      p.vy += 0.33;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.62);
      ctx.restore();
    });

    if (elapsed < 2600) requestAnimationFrame(frame);
    else canvas.remove();
  }
  requestAnimationFrame(frame);
}

/* ============ 9. MUSIK ============ */
const Music = (() => {
  let ctx = null;
  let master = null;
  let timer = null;
  let playing = false;
  let stepIndex = 0;

  const NOTES = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
  const PATTERN = [0, 2, 4, 3, 1, 5, 2, 4];

  function init() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0;

    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 2400;

    const delay = ctx.createDelay();
    delay.delayTime.value = 0.32;
    const fb = ctx.createGain();
    fb.gain.value = 0.26;

    master.connect(filter);
    filter.connect(ctx.destination);
    filter.connect(delay);
    delay.connect(fb);
    fb.connect(delay);
    delay.connect(ctx.destination);
  }

  function playNote(freq, time, dur) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(0.16, time + 0.7);
    gain.gain.exponentialRampToValueAtTime(0.0008, time + dur);
    osc.connect(gain);
    gain.connect(master);
    osc.start(time);
    osc.stop(time + dur + 0.06);
  }

  function schedule() {
    if (!ctx || !playing) return;
    const now = ctx.currentTime;
    const idx = PATTERN[stepIndex % PATTERN.length];
    const freq = NOTES[idx];
    playNote(freq, now + 0.05, 2.6);
    if (stepIndex % 4 === 0) playNote(freq * 2, now + 0.12, 2.0);
    stepIndex++;
    timer = setTimeout(schedule, 1700);
  }

  return {
    start() {
      init();
      if (!ctx) return false;
      if (ctx.state === 'suspended') ctx.resume();
      playing = true;
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
      master.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 2.2);
      clearTimeout(timer);
      schedule();
      return true;
    },
    stop() {
      if (!ctx || !playing) return;
      playing = false;
      clearTimeout(timer);
      timer = null;
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
      master.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.8);
    },
    toggle() {
      if (playing) { this.stop(); return false; }
      return this.start();
    },
    get isPlaying() { return playing; }
  };
})();
